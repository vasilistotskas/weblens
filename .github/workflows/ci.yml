name: CI

# Build / lint / test gate. Deployment is handled by Cloudflare Workers Builds
# (connected to this repo), which auto-builds and deploys on push to main — so
# there is intentionally NO deploy step here (avoids a redundant second deploy).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install pnpm BEFORE setup-node so the pnpm cache below resolves. The
      # pnpm version is read from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11 requires Node >= 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
