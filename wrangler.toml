# WebLens - Premium Web Intelligence API
# Cloudflare Workers configuration

name = "weblens-production"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Disable workers.dev subdomain (using custom domain)
workers_dev = false
preview_urls = false

# ============================================
# Custom Domain
# ============================================

[[routes]]
pattern = "api.weblens.dev"
custom_domain = true

# ============================================
# Environment Variables
# ============================================

[vars]
NETWORK = "base"
# Structured-log verbosity for src/utils/logger.ts (debug|info|warn|error|silent).
LOG_LEVEL = "info"
# Public wallet address for receiving payments
PAY_TO_ADDRESS = "0x5f71Ce4135004b5fa4dF81014721598E1C7c5AF8"
# Solana payout address. Setting it advertises a second "accepts" entry so
# buyers can pay on Solana as well as Base. PayAI settles it with a sponsored
# feePayer, so this needs no SOL and no Solana RPC.
#
# It MUST be an address whose USDC associated token account already exists:
# an SVM "exact" payment is an SPL TransferChecked and the facilitator is
# required to verify the destination account exists, so an address that has
# never held USDC would 402 buyers into a settlement that cannot succeed.
# Send it any amount of USDC once to initialise the account.
# Leaving this unset (or blank) keeps Solana entirely unadvertised.
#
# This is the Phantom wallet's Solana address (the same wallet as the Base
# PAY_TO_ADDRESS). Its USDC associated token account
# BVo3EAd4faSJS3v66iQyutdcjL9qp2iAFGHYro3VbrFq was initialised 2026-10-07 by a
# Kraken withdrawal, verified on-chain as the derived ATA for mint
# EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v. Never close that token account
# in the wallet: Solana payments would fail to settle until it is re-created.
PAY_TO_ADDRESS_SVM = "34sd6wPrmoR9UG9rUgYAFtcWYSVzqDNsvH9VkCkycUeb"
# Facilitators per network family, tried in order (src/services/facilitator-chain.ts).
# Base: CDP first, because the CDP Bazaar indexes and ranks a route only by
# payments the CDP facilitator settled; PayAI takes over a payment CDP fails on.
# Solana: PayAI only, since its fee payer is part of the quote.
FACILITATORS_EVM = "cdp,payai"
FACILITATORS_SVM = "payai"
# Secrets are set via Cloudflare dashboard or `wrangler secret put`
# Do NOT add API keys here — they will be committed to version control

# ============================================
# KV Namespace for Caching
# ============================================

# Create KV namespace: wrangler kv:namespace create "CACHE"
# Then add the id below
[[kv_namespaces]]
binding = "CACHE"
id = "4b22a633ea824b80a3ec8003add92d0c"

# ============================================
# Durable Objects
# ============================================

[[durable_objects.bindings]]
name = "CREDIT_MANAGER"
class_name = "CreditAccountDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorScheduler"]

# v2 migration: introduce CreditAccountDO as a SQLite-backed Durable Object.
# Migration entries are append-only — never edit v1, always add a new tag.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["CreditAccountDO"]

# v3: the URL-monitor feature was removed. Deleting the class deletes every
# MonitorScheduler object and its storage. A delete migration requires the
# class binding and export to be gone in the same deploy.
[[migrations]]
tag = "v3"
deleted_classes = ["MonitorScheduler"]

# ============================================
# Browser Rendering
# Note: Requires paid Workers plan
# ============================================

[browser]
binding = "BROWSER"

# Payment funnel events (src/services/payment-telemetry.ts): one data point per
# paid-route request, adaptively sampled, 3-month retention. Queried by
# scripts/payment-funnel.ts through the Analytics Engine SQL API.
[[analytics_engine_datasets]]
binding = "PAYMENT_EVENTS"
dataset = "weblens_payment_events"

# ============================================
# Secrets (set via `wrangler secret put` or Cloudflare dashboard)
# ============================================
# Core secrets:
#
#   wrangler secret put CDP_API_KEY_ID
#   wrangler secret put CDP_API_KEY_SECRET
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put SERP_API_KEY
#
# Optional — Stripe fiat onramp (POST /credits/deposit/fiat):
# Lets agent devs without crypto wallets buy credits with a card.
# Configure at https://dashboard.stripe.com/apikeys + /webhooks (add
# `checkout.session.completed` event pointing to /credits/webhook/stripe).
#
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#
# Optional: set STRIPE_WEBHOOK_SECRET_2 during a webhook-secret rotation.
# Both secrets verify concurrently; remove the secondary after rotation ends.
#   wrangler secret put STRIPE_WEBHOOK_SECRET_2

# ============================================
# Build Configuration
# ============================================

[build]
command = "npm run build"

# ============================================
# Observability
# ============================================

[observability]
enabled = true
# Sample 10% of invocations into Workers Logs to bound cost at production volume.
# (Errors/console.error are retained independently of head sampling.)
head_sampling_rate = 0.1

# ============================================
# Testnet Environment (Base Sepolia)
# For testing with fake USDC - no real money!
# Run: wrangler dev --env testnet
# ============================================

[env.testnet]
name = "weblens-testnet"
workers_dev = true
# CRITICAL: explicitly clear inherited routes so the testnet worker does NOT
# bind api.weblens.dev. Without this, the top-level [[routes]] block is
# inherited and the testnet deploy steals the production custom domain,
# silently switching api.weblens.dev to Base Sepolia challenges.
routes = []

# Testnet has its own cache namespace (title "testnet-CACHE"): sharing production's let testnet
# traffic consume production rate limits, replay markers, receipts and cached pages.
[[env.testnet.kv_namespaces]]
binding = "CACHE"
id = "598325d952f84f77ba1bf5ebcf3ebfba"

[[env.testnet.durable_objects.bindings]]
name = "CREDIT_MANAGER"
class_name = "CreditAccountDO"

# Note: migrations are worker-global and live at the top level — do NOT
# duplicate them here. The testnet worker (weblens-testnet) tracks its own
# applied-migrations cursor independently of weblens-production.

[env.testnet.vars]
# Use Base Sepolia testnet
NETWORK = "base-sepolia"
LOG_LEVEL = "info"
# Payment receiving address (use same or different for testing)
PAY_TO_ADDRESS = "0x5f71Ce4135004b5fa4dF81014721598E1C7c5AF8"
FACILITATORS_EVM = "x402.org"
FACILITATORS_SVM = "payai"
# Blank keeps Solana devnet unadvertised: the payout address has no devnet
# USDC account, and a destination without one cannot receive a settlement
# (see PAY_TO_ADDRESS_SVM in the top-level [vars]).
PAY_TO_ADDRESS_SVM = ""

[env.testnet.browser]
binding = "BROWSER"

[[env.testnet.analytics_engine_datasets]]
binding = "PAYMENT_EVENTS"
dataset = "weblens_payment_events_testnet"

[env.testnet.observability]
enabled = true
